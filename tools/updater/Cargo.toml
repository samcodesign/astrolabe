[package]
name = "pob-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.33"
hex = "0.4.3"
humantime = "2.4.0"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
