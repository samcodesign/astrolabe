[package]
name = "poe-planner"
version = "0.1.0"
description = "A passive tree planner driven by Path of Building's own calculation engine."
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 builds the app as a library so mobile targets can link it; the binary
# below is a thin shim.
name = "poe_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only used for the GGG character API: the webview cannot call it directly
# (CORS), and the endpoints need a real User-Agent plus cookie handling.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
